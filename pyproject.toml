[project]
name = "thai-ocr"
version = "0.1.0"
description = "Handwritten Thai consonant (ก-ฮ) recognition"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy",
    "pillow",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
